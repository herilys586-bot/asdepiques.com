<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090711"><title>asdepiques.com — Galerie des 31 As</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#35214d 0%,#101022 32%,#07070e 75%);color:#f5f1fb;min-height:100vh}header{text-align:center;padding:45px 15px 24px;border-bottom:1px solid #50386b}h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,65px);letter-spacing:.045em;margin:0;color:#eee1ff;text-shadow:0 0 30px #9b55f6}header p{color:#c3b3d9;letter-spacing:.2em;text-transform:uppercase;font-size:12px}main{max-width:1200px;margin:auto;padding:26px 15px 70px}.status{text-align:center;color:#cbbadd;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{border:1px solid #493458;background:#171122;border-radius:12px;overflow:hidden;color:inherit;text-align:left;padding:0;cursor:pointer;transition:transform .2s,border-color .2s}.tile:focus-visible,.tile:hover{outline:none;transform:translateY(-3px);border-color:#b48aff}.thumb{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(140deg,#22142e,#0c0d18);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.empty{font-size:50px;color:#59446a}.meta{padding:11px 12px}.meta strong{display:block;color:#e4d4fa}.meta small{color:#aa9bb8}dialog{border:1px solid #6c5088;border-radius:14px;background:#090711;color:white;padding:0;width:min(96vw,850px);max-height:96dvh}dialog::backdrop{background:#000d}.viewer{display:flex;flex-direction:column}.viewer img{max-width:100%;max-height:75dvh;object-fit:contain;margin:auto}.viewerbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px}.viewerbar button{background:#2b1e3e;border:1px solid #65478c;color:#fff;border-radius:8px;padding:10px 13px;cursor:pointer}.viewerbar span{text-align:center}footer{text-align:center;color:#9886aa;padding:30px 12px;font-size:13px}a{color:#c7aaff}@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.viewerbar button{padding:10px}}
</style></head><body><header><h1>asdepiques.com</h1><p>La galerie des 31 As</p></header><main><p class="status" id="status"></p><section class="grid" id="grid" aria-label="Les 31 œuvres"></section></main><footer>Collection de 31 œuvres figées · Prépublication · Galerie de contrôle</footer><dialog id="modal"><div class="viewer"><div class="viewerbar"><button id="prev" aria-label="Œuvre précédente">←</button><span id="caption"></span><button id="next" aria-label="Œuvre suivante">→</button><button id="close" aria-label="Fermer">✕</button></div><img id="large" alt=""></div></dialog><script>
const titles={1:'L’As Royal',2:'La Reine de Piques',3:'L’As Minimaliste',4:'L’As de la Street',5:'L’As de Glace',6:'L’As de Mnémos',7:'Le Septième Ciel',8:'L’As de l’Infini',9:'Neuf',10:'L’As au Bic Bleu',19:'La Légion',21:'Le Point de rupture',22:'Les Jumeaux opposés',23:'Le Terrain des As',24:'L’As des Abysses',25:'Le Langage universel',26:'Le Cœur mécanique',27:'Les Mondes réunis',28:'Le Damier d’Argent',29:'Le Papyrus',30:'La Victoire mondiale',31:'Les Portes de l’Avenir'};
const available=new Set(Array.from({length:31},(_,i)=>i+1));const grid=document.getElementById('grid');let current=27;const modal=document.getElementById('modal');function file(n){return 'images/'+String(n).padStart(3,'0')+'.png'}function label(n){return '#'+String(n).padStart(3,'0')}function show(n){if(!available.has(n))return;current=n;document.getElementById('large').src=file(n);document.getElementById('large').alt='Œuvre '+label(n);document.getElementById('caption').textContent=label(n)+' · '+(titles[n]||'As de pique');if(!modal.open)modal.showModal()}function move(step){let a=[...available].sort((x,y)=>x-y);show(a[(a.indexOf(current)+step+a.length)%a.length])}for(let n=1;n<=31;n++){let btn=document.createElement('button');btn.className='tile';let thumb=document.createElement('div');thumb.className='thumb';if(available.has(n)){let im=document.createElement('img');im.src=file(n);im.alt='';im.loading='lazy';thumb.append(im);btn.onclick=()=>show(n)}else{thumb.innerHTML='<span class="empty">♠</span>';btn.disabled=true;btn.style.cursor='default';btn.title='Original à intégrer'}let meta=document.createElement('div');meta.className='meta';let name=document.createElement('strong');name.textContent=label(n);let sub=document.createElement('small');sub.textContent=available.has(n)?(titles[n]||'Œuvre originale'):'Original à intégrer';meta.append(name,sub);btn.append(thumb,meta);grid.append(btn)}document.getElementById('status').textContent=available.size+' œuvres intégrées sur 31 · Version de prépublication';document.getElementById('close').onclick=()=>modal.close();document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(!modal.open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});let x=null;document.getElementById('large').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});document.getElementById('large').addEventListener('touchend',e=>{if(x===null)return;let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)move(d<0?1:-1);x=null},{passive:true});
</script></body></html>
